domain_standard:
  market: cannabis retail inventory and wholesale purchasing
  standard_detected: false
  candidate: state seed-to-sale track-and-trace identifiers (METRC / BioTrack)
  evidence: >-
    PackageResponse.regulatoryId is described as "Regulatory package identifier, when available" and the
    package search parameter matches against "product name, POS package ID, and regulatory ID". The
    2026-04-01 release-notes entry states the Replenishment report includes METRC package IDs. That is a
    genuine regulatory identifier carried through the contract, but it is an opaque string field, not an
    implementation of a standard message set, schema URN or endpoint shape — the contract declares no
    METRC/BioTrack API conformance and no cannabis interoperability standard exists in scoring.yml's
    recognised set. Recorded as detected-but-not-conformant so the finding is not lost, and NOT claimed as
    domain-standard conformance.
  note: >-
    Cannabis retail has no cross-vendor API interoperability standard. Happy Cabbage instead publishes its
    own normalisation layer — "universal brands" and "universal categories" that map POS-specific brand and
    category vocabularies (Dutchie, Flowhub, Blaze, Treez, Meadow) onto canonical ids. That is a de-facto
    private standard, exposed at GET /external/v1/universal-brands and /external/v1/universal-categories,
    and it is the most interoperability-shaped thing in the contract.
