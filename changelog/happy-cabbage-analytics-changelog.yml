note: >-
  Happy Cabbage publishes a dated, filterable release-notes page for the Happy Buyers product. Entries are
  product-level, not API-level: they carry no version number, no semver tag, and no breaking-vs-additive
  labelling, and there is no separate API changelog. Only the 2026-06-05 entry announces the External API
  itself. The recent window below is verbatim-sourced from that page; each entry links to a "Learn more"
  article on the same site.
current_version: v1
current_version_note: From info.version in the External API contract; the release-notes page does not version.
cadence: irregular, roughly two to five entries per month
